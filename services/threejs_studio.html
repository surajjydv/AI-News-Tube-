<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI-NewsTube 3D WebGL Virtual Newsroom Studio</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #canvas-container { width: 1920px; height: 1080px; }
    </style>
    <!-- Three.js + GLTFLoader CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <script>
        const width = 1920;
        const height = 1080;

        // 1. THREE.JS SCENE & CAMERA SETUP
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x040817);

        const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
        camera.position.set(0, 1.3, 5.8);
        camera.lookAt(0, 0.6, 0);

        // 2. WEBGL RENDERER & HIGH-END SHADOWS / TONE MAPPING
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 3. 3D CURVED LED VIDEO WALL
        const ledGeo = new THREE.CylinderGeometry(14, 14, 9, 64, 1, true, Math.PI * 0.72, Math.PI * 0.56);
        const textureLoader = new THREE.TextureLoader();

        const ledMat = new THREE.MeshStandardMaterial({
            color: 0x0c1e45,
            emissive: 0x081535,
            emissiveIntensity: 1.2,
            side: THREE.DoubleSide,
            roughness: 0.15,
            metalness: 0.3
        });

        const ledWall = new THREE.Mesh(ledGeo, ledMat);
        ledWall.position.set(0, 3.2, -4.5);
        scene.add(ledWall);

        // Function to update LED Wall texture dynamically
        window.setLEDWallTexture = function(imgUrl) {
            textureLoader.load(imgUrl, function(tex) {
                tex.wrapS = THREE.ClampToEdgeWrapping;
                tex.wrapT = THREE.ClampToEdgeWrapping;
                ledMat.map = tex;
                ledMat.emissiveMap = tex;
                ledMat.emissiveIntensity = 0.8;
                ledMat.needsUpdate = true;
            });
        };

        // 4. 3D METALLIC NEWS DESK
        const deskGroup = new THREE.Group();

        // Main Metallic Desk Base
        const deskGeo = new THREE.CylinderGeometry(3.5, 3.0, 1.1, 48, 1, false, Math.PI * 0.68, Math.PI * 0.64);
        const deskMat = new THREE.MeshStandardMaterial({
            color: 0x0b1022,
            metalness: 0.88,
            roughness: 0.12
        });
        const desk = new THREE.Mesh(deskGeo, deskMat);
        desk.castShadow = true;
        desk.receiveShadow = true;
        deskGroup.add(desk);

        // Recessed Metallic Red LED Accent Light Strip
        const stripGeo = new THREE.TorusGeometry(3.52, 0.05, 16, 64, Math.PI * 0.64);
        const stripMat = new THREE.MeshBasicMaterial({ color: 0xee2222 });
        const strip = new THREE.Mesh(stripGeo, stripMat);
        strip.rotation.x = Math.PI / 2;
        strip.position.set(0, 0.45, 0);
        deskGroup.add(strip);

        // Gold Trim Line on Top Desk Edge
        const goldGeo = new THREE.TorusGeometry(3.51, 0.02, 16, 64, Math.PI * 0.64);
        const goldMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
        const goldSt = new THREE.Mesh(goldGeo, goldMat);
        goldSt.rotation.x = Math.PI / 2;
        goldSt.position.set(0, 0.52, 0);
        deskGroup.add(goldSt);

        deskGroup.position.set(0, 0.05, 0);
        scene.add(deskGroup);

        // 5. 3D SPECULAR STAGE FLOOR WITH REFLECTION MAP
        const floorGeo = new THREE.PlaneGeometry(35, 35);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x030614,
            metalness: 0.92,
            roughness: 0.06
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        scene.add(floor);

        // 6. 3D LIGHTING RIG (Spotlights & Volumetric Fill)
        const keyLight = new THREE.SpotLight(0xfff5e6, 4.0, 30, Math.PI / 4, 0.3, 1);
        keyLight.position.set(3, 6, 5);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x80b0ff, 1.8);
        fillLight.position.set(-4, 5, 4);
        scene.add(fillLight);

        const rimLight = new THREE.SpotLight(0xff2222, 3.0, 20, Math.PI / 3);
        rimLight.position.set(0, 5, -3);
        scene.add(rimLight);

        const ambientLight = new THREE.AmbientLight(0x0e1832, 0.9);
        scene.add(ambientLight);

        // 7. GLTF 3D MODEL LOADER SUPPORT
        window.loadGLTFStudioModel = function(modelUrl) {
            if (typeof THREE.GLTFLoader !== 'undefined') {
                const loader = new THREE.GLTFLoader();
                loader.load(modelUrl, function(gltf) {
                    const model = gltf.scene;
                    model.position.set(0, 0, -2);
                    model.scale.set(1.5, 1.5, 1.5);
                    scene.add(model);
                });
            }
        };

        // 8. ANIMATION DRIVER (3D Pan, Tilt, Dolly Zoom)
        let currentTime = 0;
        window.renderFrameAtTime = function(t) {
            currentTime = t;

            // 3D Cinematic Camera Dolly & Slow Orbit
            camera.position.x = 0.45 * Math.sin(t * Math.PI * 0.2);
            camera.position.y = 1.30 + 0.12 * Math.sin(t * Math.PI * 0.15);
            camera.position.z = 5.80 - 0.35 * Math.sin(t * Math.PI * 0.2);
            camera.lookAt(0, 0.55, 0);

            // Dynamic Spotlight Intensity & Sweep
            keyLight.intensity = 4.0 + 0.6 * Math.sin(t * Math.PI * 1.5);
            rimLight.position.x = 2.0 * Math.sin(t * Math.PI * 0.3);

            renderer.render(scene, camera);
        };

        // Render initial static frame at t=0
        window.renderFrameAtTime(0);
    </script>
</body>
</html>
